# fly.toml app configuration file generated for margin-reader-rtesfq on 2026-11-10T19:24:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'margin-reader-rtesfq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/margin.db'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'margin_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
